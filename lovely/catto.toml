[manifest]
version = "1.0.0"
priority = 4

[[patches]]
# this is very awesome jank that shouldnt break with updates adding newlines to the end anymore
[patches.copy]
target = '''=[SMODS cardpronouns "badge.lua"]'''
position = "append"
sources = [
    "lovely/pronounbadges.lua"
]

[[patches]]
[patches.regex]
target = '''=[SMODS cardpronouns "badge.lua"]'''
pattern = '''end\n+AAAAAAAAAAAAAAAAAAAAAAA'''
position = "at"
payload = ''
match_indent = false

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = '''local cfg = (card and card.ability) or _c['config']'''
position = "before"
payload = '''if _c.set == "ECattos_Compound" then
	local compound = elementcattos.compounds[_c.key]
	localize{type = 'descriptions', key = "recipe", set = "ECattos_Compound", nodes = desc_nodes, vars = {
		type(compound[2]) == "table" and localize(elementcattos.compounds[_c.key][2].name) or topuplib.nameFromKey(compound[2]),
		elementcattos.formatFormula(elementcattos.compounds[_c.key][1], true)
	}}
	badges.card_type = nil
end'''
match_indent = true

[[patches]]
# Radioactive info_queue
[patches.pattern]
target = "functions/common_events.lua"
pattern = 'for _, v in ipairs(info_queue) do'
position = "before"
payload = '''
if card then
	local rd = elementcattos.isRadioactive(card)
	if rd and rd.hands and not rd.glowonly then
		info_queue[#info_queue+1] = {set = "Other", key = rd.explode and "ecattos_radioactive_explodes" or "ecattos_radioactive", specific_vars = {card.ability.ecattos_rd_hands or rd.hands}}
	end
end
'''
match_indent = true

[[patches]]
# Radioactive calculate
[patches.pattern]
target = "functions/state_events.lua"
pattern = '-- TARGET: effects before deck final_scoring_step'
position = "before"
payload = '''
	elementcattos.radioactiveCalculate()
'''
match_indent = true